pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs,json}"
      run: npx biome check --no-errors-on-unmatched {staged_files}
    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx tsc
